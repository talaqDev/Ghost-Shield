[tool.poetry]
name = "ghost-shield"
version = "0.1.0"
description = "AI Security & Vector Database Privacy Audit Framework"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "ghost_shield"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
torch = "^2.2.0"
sentence-transformers = "^2.5.0"
faiss-cpu = "^1.8.0"
chromadb = "^0.4.24"
qdrant-client = "^1.8.0"
numpy = "^1.26.0"
scikit-learn = "^1.4.0"
nltk = "^3.8.1"
rouge-score = "^0.1.2"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
black = "^24.2.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
