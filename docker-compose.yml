services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ghost_shield_backend
    ports:
      - "8000:8000"
    volumes:
      - ./ghost_shield:/app/ghost_shield
    environment:
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
